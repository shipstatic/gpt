# The listing's clock.
#
# This repo holds no product code: it holds the sources of the plugin package
# OpenAI's directory takes, and `scripts/preflight.mjs` compares the package
# to its owners and the live `/gpt` door to what OpenAI's scan evaluates. The
# door moves in ANOTHER repo (`cloudflare/mcp`), on its own cadence, and once
# the plugin is published OpenAI scans it daily and HOLDS a tool whose
# annotations, description or schema it flags, so a release there can change
# what users get without anyone here touching anything. A check that only
# runs when somebody is about to submit is a check that runs once. So it runs
# on a schedule as well as on push, and names the hold before the scan does.
#
# Tests-only, main-only: nothing here publishes anything, and the repo keeps
# its `main`-only exemption from the development-branch model (root
# CLAUDE.md, "Branch & CI Model"). GitHub-hosted on purpose: the checks reach
# the public production door from an outside vantage point, the same reason
# `edge-reachability.yml` stays hosted.
#
# No pnpm setup step: the manifest declares no dependencies and no
# packageManager, and preflight is a plain Node script, so `node` runs it
# directly. Adding pnpm here would install nothing and pin nothing.
name: CI

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 07:00 UTC: often enough that a flip is noticed within
    # the week it happens, rare enough that the notice is not noise.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preflight against production
        run: node scripts/preflight.mjs

  # A red run on a push or a schedule reaches the operator's alerts channel; a
  # pull request's red already has a reader, its author. The webhook lives in
  # this job alone, which runs nothing but curl, and an unset secret fails the
  # job rather than skipping it. Root CLAUDE.md, "CI notifications".
  notify:
    needs: [preflight]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔴 gpt CI failed on $GITHUB_REF_NAME"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set on this repository, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
